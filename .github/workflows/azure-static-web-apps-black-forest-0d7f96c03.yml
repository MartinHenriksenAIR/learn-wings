name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
      - 'integration/**'

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          # Vite inlines VITE_* at build time. None of these are secrets:
          # the Entra client id is a public client identifier.
          VITE_ENTRA_CLIENT_ID: 2f2f3964-fa8b-4ecc-97fe-85b969c0855a
          # Direct function-app calls (CORS via ALLOWED_ORIGINS) — SWA linked backends don't
          # support preview environments, so the backend is unlinked during the migration.
          # At merge time: re-link the SWA backend and set this back to "" (same-origin /api).
          VITE_API_BASE_URL: https://func-ai-education-migration-c0fgeqdnfvd6h0cf.swedencentral-01.azurewebsites.net
          # Canonical production origin for minted links (invite/signup) — #115. Pinned ONLY for
          # the production push build; PR previews get "" and fall back to window.location.origin
          # so preview-minted links stay on the preview host (#80). Requires the www host to be in
          # the function app's ALLOWED_ORIGINS (which also feeds the invite-link allowlist) before
          # this deploys, or invite emails 400.
          VITE_PLATFORM_BASE_URL: ${{ github.event_name == 'push' && 'https://www.ai-uddannelse.dk' || '' }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_FOREST_0D7F96C03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments and preview environments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_FOREST_0D7F96C03 }}
          action: "close"
