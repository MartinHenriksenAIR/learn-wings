name: CI

on:
  pull_request:
    branches:
      - main
      - 'integration/**'
  push:
    branches:
      - main
      - 'integration/**'

jobs:
  frontend:
    name: Frontend lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.app.json
      # The tooling tree: vite.config.ts, playwright.config.ts and e2e/. A pure
      # type-check — it starts no browser and touches no network or database, so it
      # is safe here where the e2e suite it covers deliberately is not (e2e/README.md).
      - run: npx tsc --noEmit -p tsconfig.node.json
      - run: npm test
      - run: npm run build

  functions:
    name: Functions build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # Matches the deployed runtime pin (~20, see ADR-0006 amendment).
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
